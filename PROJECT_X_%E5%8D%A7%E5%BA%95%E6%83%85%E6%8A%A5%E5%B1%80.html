<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROJECT X｜卧底情报局</title><style>:root{font-family:system-ui,'Microsoft YaHei',sans-serif;color:#eef7ff;background:#071426}*{box-sizing:border-box}body{margin:0;padding:20px}.wrap{max-width:760px;margin:auto}.hero{background:linear-gradient(125deg,#132f51,#0c182a);padding:24px;border:1px solid #2b5975;border-radius:20px}h1{margin:4px 0 8px;font-size:clamp(24px,5vw,36px)}.sub{color:#a5c2d5}.panel{margin-top:15px;background:#102239;border:1px solid #2b4a65;border-radius:16px;padding:18px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.groups,.numbers,.scores{display:grid;gap:9px}.groups{grid-template-columns:repeat(6,1fr);margin-top:12px}.numbers{grid-template-columns:repeat(5,1fr);margin-top:16px}button{font:inherit;cursor:pointer;border:1px solid #4b819d;border-radius:12px;padding:12px;background:#1b3b57;color:white;font-weight:700}button:hover:not(:disabled){background:#275474}button:disabled{opacity:.36;cursor:default}button.selected{background:#55d3e3;color:#082237;border-color:#55d3e3}button.done{background:#17293a;color:#7790a0;border-color:#243b50}.num{height:78px;font-size:24px}.num small{display:block;font-size:11px;font-weight:400}.secret{margin-top:16px;text-align:center;border:2px solid #55d3e3;border-radius:18px;padding:24px;background:#12364b}.emoji{font-size:72px}.word{font-size:34px;font-weight:800}.english{color:#c2d5e4;margin:8px 0 22px}.primary{background:#55d3e3;color:#082237}.warning{color:#f8d39b}.hidden{display:none!important}.scores{grid-template-columns:repeat(4,1fr);margin-top:10px}.scores button{padding:10px 5px}select{font:inherit;color:#fff;background:#1b3b57;border:1px solid #4b819d;border-radius:12px;padding:12px;min-height:48px}.small{font-size:13px;color:#9bb7c9}.footer{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:12px}.footer button{min-width:120px}@media(max-width:480px){body{padding:10px}.panel{padding:13px}.groups{gap:5px}.groups button{padding:10px 3px}.num{height:68px}.scores{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.hero{padding:17px}.hero h1{font-size:26px}.groups{grid-template-columns:repeat(3,1fr);gap:9px}.groups button{min-height:48px}.numbers{grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.num{height:72px;padding:6px 1px}.num small{font-size:10px}.secret{padding:18px 12px}.emoji{font-size:66px}.word{font-size:31px}.secret .primary{width:100%;min-height:54px}.footer button{min-height:48px}}@media print{body{display:none}}</style></head><body><main class="wrap"><header class="hero"><div style="letter-spacing:3px;color:#55d3e3;font-weight:800">PROJECT X // CASE FILE 001</div><h1>🕵️ 卧底情报局</h1><div class="sub">关主单手机模式 · 自选人数 · 3轮任务</div></header><section class="panel"><div class="row"><strong>本轮参与人数</strong><select id="players" aria-label="选择参与人数"></select><span id="roleCount" class="small"></span></div><p class="small">关主先选择人数，系统自动生成对应号码与卧底人数。更改人数会重置本局。</p></section><section class="panel"><div class="row"><strong>选择组合（学生只看到 A–F）</strong><strong id="round">ROUND 1 / 3</strong></div><div class="groups" id="groups"></div><p class="small">切换组合会重新抽取本轮卧底，并清除本轮已领取记录。</p></section><section class="panel"><div class="row"><strong>选择你的调查员号码</strong><span id="progress">已领取 0 / 10</span></div><div class="numbers" id="numbers"></div><div id="secret" class="secret hidden" aria-live="polite"><div id="owner" class="small"></div><div id="emoji" class="emoji"></div><div id="word" class="word"></div><div id="english" class="english"></div><button class="primary" id="hide">我已记住 · 隐藏词语</button></div><p id="hint" class="small">请逐个领取词语，其他同学不要观看屏幕。</p></section><section class="panel"><div class="row"><strong>🔒 关主区域</strong><button id="teacherToggle">查看关主答案</button></div><div id="teacher" class="hidden"><p class="warning">请先确认学生没有观看屏幕。此模式仅用于现场监督，并非密码保护。</p><div id="answers"></div></div><div style="margin-top:16px"><strong>本轮得分</strong><div class="scores" id="scores"></div></div><div class="footer"><span id="total">累计 0 / 6 分</span><button class="primary" id="next">下一轮 →</button></div><p class="small" id="status">每轮猜中全部卧底得2分，猜中部分得1分，未猜中得0分；累计3分通关。</p></section></main><script>const PAIRS=[{id:'A',a:['图书馆','Library','📚'],b:['书店','Bookstore','📖']},{id:'B',a:['巴士','Bus','🚌'],b:['校车','School Bus','🚍']},{id:'C',a:['羽毛球','Badminton','🏸'],b:['网球','Tennis','🎾']},{id:'D',a:['医院','Hospital','🏥'],b:['诊所','Clinic','🩺']},{id:'E',a:['饼干','Biscuit','🍪'],b:['蛋糕','Cake','🍰']},{id:'F',a:['电梯','Elevator','🛗'],b:['楼梯','Stairs','🪜']}];let playerCount=10,group=0,round=1,spies=[],seen=new Set(),active=null,teacher=false,scores=[null,null,null];const $=id=>document.getElementById(id);function spyCount(){return playerCount<=5?1:playerCount<=12?2:3}function randomSpies(){let a=Array.from({length:playerCount},(_,i)=>i+1);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,spyCount())}function reset(){spies=randomSpies();seen=new Set();active=null;teacher=false;render()}function render(){const pair=PAIRS[group];$('players').value=String(playerCount);$('roleCount').textContent=`${spyCount()}名卧底 + ${playerCount-spyCount()}名平民`;$('round').textContent=`ROUND ${round} / 3`;$('groups').innerHTML=PAIRS.map((p,i)=>`<button class="${i===group?'selected':''}" data-group="${i}">组合${p.id}</button>`).join('');document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{if(active!==null&&!confirm('当前词语还未隐藏，确定切换组合？'))return;group=Number(b.dataset.group);reset()});$('numbers').innerHTML=Array.from({length:playerCount},(_,i)=>i+1).map(n=>`<button class="num ${seen.has(n)?'done':''}" data-num="${n}" ${seen.has(n)||active!==null?'disabled':''}>${n}<small>${seen.has(n)?'已领取':'点击查看'}</small></button>`).join('');document.querySelectorAll('[data-num]').forEach(b=>b.onclick=()=>{active=Number(b.dataset.num);render()});$('progress').textContent=`已领取 ${seen.size} / ${playerCount}`;$('secret').classList.toggle('hidden',active===null);$('hint').textContent=active!==null?'查看后请立即隐藏词语，再让下一位同学靠近。':seen.size===playerCount?'所有人已领取！开始描述、讨论及投票。':'请逐个领取词语，其他同学不要观看屏幕。';if(active!==null){const w=spies.includes(active)?pair.b:pair.a;$('owner').textContent=`仅限 ${active} 号调查员查看`;$('emoji').textContent=w[2];$('word').textContent=w[0];$('english').textContent=w[1]}$('teacher').classList.toggle('hidden',!teacher);$('teacherToggle').textContent=teacher?'隐藏关主答案':'查看关主答案';$('answers').textContent=`卧底号码：${[...spies].sort((a,b)=>a-b).join('、')} ｜ 平民：${pair.a[0]} ｜ 卧底：${pair.b[0]}`;$('scores').innerHTML=[null,0,1,2].map(s=>`<button data-score="${s===null?'n':s}" class="${scores[round-1]===s?'selected':''}">${s===null?'未评分':s+'分'}</button>`).join('');document.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>{scores[round-1]=b.dataset.score==='n'?null:Number(b.dataset.score);render()});const total=scores.reduce((sum,s)=>sum+(s||0),0);$('total').textContent=`累计 ${total} / 6 分`;$('next').textContent=round<3?'下一轮 →':'重新开始';$('status').textContent=round===3&&scores.every(s=>s!==null)?(total>=3?'🎉 已达到3分，挑战通过！':'尚未达到3分，可由关主安排一次提示或补救机会。'):'每轮猜中全部卧底得2分，猜中部分得1分，未猜中得0分；累计3分通关。'}$('players').innerHTML=Array.from({length:12},(_,i)=>i+4).map(n=>`<option value="${n}">${n}人</option>`).join('');$('players').value=String(playerCount);$('players').onchange=()=>{const n=Number($('players').value);if(n===playerCount)return;if((seen.size||round>1)&&!confirm('更改人数将清除所有轮次与得分，确定继续？')){$('players').value=String(playerCount);return}playerCount=n;round=1;scores=[null,null,null];reset()};$('hide').onclick=()=>{if(active!==null){seen.add(active);active=null;render()}};$('teacherToggle').onclick=()=>{if(!teacher&&!confirm('请确认没有学生观看屏幕。现在显示关主答案？'))return;teacher=!teacher;render()};$('next').onclick=()=>{if(active!==null){alert('请先隐藏当前词语。');return}if(round<3){round++;reset()}else{if(!confirm('确定清除全部三轮分数，开始新游戏？'))return;round=1;scores=[null,null,null];reset()}};reset();</script></body></html>
